    <title>Keshav Turbo Services — Steam Turbine Overhauling &amp; Spares, Shamli UP India</title>

    />

    <!-- ══ PERFORMANCE — PRECONNECT ════════════════════════════════════
         Tells the browser to open TCP/TLS connections to these origins

    <!-- ══ GOOGLE TRANSLATE ══════════════════════════════════════════════
         Suppresses the intrusive top-bar banner and tooltip overlays.
         The widget div is in <body> — hidden by CSS below.
    ════════════════════════════════════════════════════════════════════════ -->
    <style>
      /* Prevent Google Translate from pushing the page down */
      body { top: 0 !important; }
      .skiptranslate iframe,
      .goog-te-banner-frame { display: none !important; }
      #google_translate_element { display: none !important; }
      .goog-tooltip,
      .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
    <script>
      window.googleTranslateElementInit = function () {
        try {
          new window.google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'en,hi,zh-CN,es,fr,ar,ru,pt,de,ja',
              autoDisplay: false,
            },
            'google_translate_element'
          );
        } catch (e) {
          console.warn('Google Translate failed to init', e);
        }
      };
    </script>
    <script
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
      defer
      onerror="console.warn('Google Translate unavailable')"
    ></script>
